server {
  listen 443 ssl;
  server_name patroller.zone;

  root /var/www/patroller;
  index index.html;

  location = /x.min.js { try_files $uri =404; }
  location = /beacon  { proxy_pass http://127.0.0.1:8787; }
  location = /cmd     { proxy_pass http://127.0.0.1:8787; }
  location /          { try_files /index.html =404; }
}